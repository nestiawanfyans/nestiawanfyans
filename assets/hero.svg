<svg width="900" height="260" viewBox="0 0 900 260" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Subtle architectural grid -->
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#21262D" stroke-width="0.7" stroke-opacity="0.55" />
    </pattern>

    <!-- Grid fade mask -->
    <radialGradient id="gridMaskGrad" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.08" />
    </radialGradient>
    <mask id="gridMask">
      <rect width="900" height="260" fill="url(#gridMaskGrad)" />
    </mask>

    <!-- Ambient aurora glows -->
    <radialGradient id="glowCyan" cx="22%" cy="18%" r="48%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.22" />
      <stop offset="55%" stop-color="#38BDF8" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#0D1117" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glowViolet" cx="80%" cy="22%" r="48%">
      <stop offset="0%" stop-color="#A855F7" stop-opacity="0.20" />
      <stop offset="55%" stop-color="#6366F1" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#0D1117" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glowBottom" cx="50%" cy="100%" r="55%">
      <stop offset="0%" stop-color="#58A6FF" stop-opacity="0.14" />
      <stop offset="100%" stop-color="#0D1117" stop-opacity="0" />
    </radialGradient>

    <!-- Name text subtle gradient -->
    <linearGradient id="nameGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F8FAFC" />
      <stop offset="55%" stop-color="#E2E8F0" />
      <stop offset="100%" stop-color="#93C5FD" />
    </linearGradient>

    <!-- Top accent hairline -->
    <linearGradient id="accentLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0D1117" stop-opacity="0" />
      <stop offset="25%" stop-color="#38BDF8" stop-opacity="0.85" />
      <stop offset="50%" stop-color="#818CF8" stop-opacity="0.95" />
      <stop offset="75%" stop-color="#C084FC" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#0D1117" stop-opacity="0" />
    </linearGradient>

    <!-- Border gradient -->
    <linearGradient id="cardBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#30363D" />
      <stop offset="50%" stop-color="#21262D" />
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.35" />
    </linearGradient>
  </defs>

  <style>
    .title {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, Helvetica, Arial, sans-serif;
      font-weight: 700;
      letter-spacing: -0.025em;
    }
    .sans {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, Helvetica, Arial, sans-serif;
    }
    .mono {
      font-family: 'SF Mono', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.35; }
    }
    .dot {
      animation: pulse 2.4s ease-in-out infinite;
    }
  </style>

  <!-- Base container -->
  <rect x="1" y="1" width="898" height="258" rx="16" fill="#0D1117" stroke="url(#cardBorder)" stroke-width="1.2" />

  <!-- Subtle grid overlay -->
  <rect x="2" y="2" width="896" height="256" rx="15" fill="url(#grid)" mask="url(#gridMask)" />

  <!-- Ambient aurora lighting -->
  <rect x="2" y="2" width="896" height="256" rx="15" fill="url(#glowCyan)" />
  <rect x="2" y="2" width="896" height="256" rx="15" fill="url(#glowViolet)" />
  <rect x="2" y="2" width="896" height="256" rx="15" fill="url(#glowBottom)" />

  <!-- Top glowing hairline -->
  <rect x="120" y="1" width="660" height="1.5" fill="url(#accentLine)" />

  <!-- Subtle corner decorative brackets -->
  <path d="M 24 40 L 24 24 L 40 24" stroke="#30363D" stroke-width="1.2" fill="none" stroke-linecap="round" />
  <path d="M 860 24 L 876 24 L 876 40" stroke="#30363D" stroke-width="1.2" fill="none" stroke-linecap="round" />
  <path d="M 24 220 L 24 236 L 40 236" stroke="#30363D" stroke-width="1.2" fill="none" stroke-linecap="round" />
  <path d="M 860 236 L 876 236 L 876 220" stroke="#30363D" stroke-width="1.2" fill="none" stroke-linecap="round" />

  <!-- Top status pill -->
  <g transform="translate(342, 36)">
    <rect width="216" height="26" rx="13" fill="#161B22" fill-opacity="0.85" stroke="#30363D" stroke-width="1" />
    <circle cx="16" cy="13" r="3.5" fill="#34D399" class="dot" />
    <text x="28" y="17" fill="#94A3B8" font-size="11" font-weight="500" class="mono">BANDAR LAMPUNG • ID</text>
  </g>

  <!-- Main Name -->
  <text x="450" y="122" text-anchor="middle" fill="url(#nameGrad)" font-size="44" class="title">Nestiawan Ferdiyanto</text>

  <!-- Motto -->
  <text x="450" y="154" text-anchor="middle" fill="#8B949E" font-size="14.5" font-weight="400" class="sans">
    Crafting clean web applications, reliable systems &amp; seamless IT solutions.
  </text>

  <!-- Role Pills -->
  <g transform="translate(175, 184)">
    <!-- Pill 1 -->
    <rect x="0" y="0" width="176" height="32" rx="8" fill="#161B22" fill-opacity="0.9" stroke="#38BDF8" stroke-opacity="0.35" stroke-width="1" />
    <circle cx="16" cy="16" r="3" fill="#38BDF8" />
    <text x="28" y="20" fill="#E2E8F0" font-size="12.5" font-weight="500" class="sans">Full-Stack Developer</text>

    <!-- Pill 2 -->
    <rect x="190" y="0" width="186" height="32" rx="8" fill="#161B22" fill-opacity="0.9" stroke="#818CF8" stroke-opacity="0.35" stroke-width="1" />
    <circle cx="206" cy="16" r="3" fill="#818CF8" />
    <text x="218" y="20" fill="#E2E8F0" font-size="12.5" font-weight="500" class="sans">Software Engineering</text>

    <!-- Pill 3 -->
    <rect x="390" y="0" width="160" height="32" rx="8" fill="#161B22" fill-opacity="0.9" stroke="#C084FC" stroke-opacity="0.35" stroke-width="1" />
    <circle cx="406" cy="16" r="3" fill="#C084FC" />
    <text x="418" y="20" fill="#E2E8F0" font-size="12.5" font-weight="500" class="sans">IT Support</text>
  </g>
</svg>
